College information and admission website 
<!DOCTYPE html>
<html>
<head>
    <title>College Website</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f4f8f6;
        }

        header {
            background-color: #176b55;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background-color: #104b3c;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 12px;
        }

        .banner {
            background-color: #d8f0e5;
            text-align: center;
            padding: 35px;
        }

        section {
            margin: 20px auto;
            padding: 20px;
            width: 85%;
            background-color: white;
            border-radius: 10px;
        }

        .card {
            display: inline-block;
            background-color: #e5f5ed;
            padding: 15px;
            margin: 8px;
            width: 220px;
            vertical-align: top;
            border-radius: 8px;
        }

        h2, h3 {
            color: #176b55;
        }

        footer {
            background-color: #104b3c;
            color: white;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 600px) {
            nav a {
                display: inline-block;
                margin: 7px;
            }

            .card {
                width: 80%;
            }
        }
    </style
